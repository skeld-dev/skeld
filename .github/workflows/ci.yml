name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Why: Only an explicit bash shell runs with pipefail, so a failed git diff cannot feed the selector an empty list.
    shell: bash

jobs:
  select:
    name: Select checks
    runs-on: ubuntu-26.04
    # Why: Select (2) + the longest selected job (7) + Checks (1) keeps the whole chain within 10 minutes.
    timeout-minutes: 2
    outputs:
      static: ${{ steps.select.outputs.static }}
      codeql: ${{ steps.select.outputs.codeql }}
      quick: ${{ steps.select.outputs.quick }}
      database: ${{ steps.select.outputs.database }}
      protocol: ${{ steps.select.outputs.protocol }}
      extended: ${{ steps.select.outputs.extended }}
      tooling: ${{ steps.select.outputs.tooling }}
      docs: ${{ steps.select.outputs.docs }}
      examples: ${{ steps.select.outputs.examples }}
      consumer: ${{ steps.select.outputs.consumer }}
      website: ${{ steps.select.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Select jobs from changed paths
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames -z "$BASE...$HEAD" | node tools/ci-select.ts
          else
            node tools/ci-select.ts --all
          fi

  static:
    name: Typecheck, lint, audit and Semgrep
    needs: select
    if: needs.select.outputs.static == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=low
      - name: Typecheck
        run: pnpm run check
      - name: Lint
        run: pnpm exec biome check . --error-on-warnings
      - name: Unused dependencies and exports
        run: pnpm run knip
      # Why: The runner's own PIPX_BIN_DIR points elsewhere, so the scan names the binary it installed.
      - name: Install Semgrep
        run: |
          PIPX_HOME="$HOME/.local/share/pipx" PIPX_BIN_DIR="$HOME/.local/bin" pipx install semgrep==1.182.1
          "$HOME/.local/bin/semgrep" --version
      - name: Semgrep rules on core and auth sources
        run: |
          "$HOME/.local/bin/semgrep" scan --metrics=off --project-root . --config .semgrep --error packages/core/src packages/auth/src

  codeql:
    name: CodeQL
    needs: select
    if: needs.select.outputs.codeql == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, actions
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # Why: One category with the weekly scan, so a pull request's alerts are compared with main's.
          category: .github/workflows/security.yml:codeql
          output: ${{ runner.temp }}/codeql-sarif
          # Why: A pull request from a fork gets a read-only token, which cannot upload results.
          upload: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'never' }}
          wait-for-processing: false
      - name: Fail on any result not suppressed in source
        env:
          SARIF: ${{ runner.temp }}/codeql-sarif
        run: node tools/sast.ts --sarif "$SARIF"

  quick:
    name: Runtime tests
    needs: select
    if: needs.select.outputs.quick == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Runtime tests
        run: pnpm test quick
      - name: Diagnostic correctness tests
        run: pnpm test diag

  database:
    name: Database tests
    needs: select
    if: needs.select.outputs.database == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL 18
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          POSTGRES_PASSWORD="$password" docker run -d --name skeld-pg -e POSTGRES_PASSWORD \
            -p 127.0.0.1:54329:5432 --tmpfs /var/lib/postgresql postgres:18-alpine > /dev/null
          for _ in $(seq 60); do
            docker exec skeld-pg pg_isready -q -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          docker exec skeld-pg pg_isready -h 127.0.0.1 -U postgres
          echo "SKELD_TEST_PG_URL=postgres://postgres:$password@127.0.0.1:54329/postgres" >> "$GITHUB_ENV"
      - name: Database tests
        run: pnpm test database

  protocol:
    name: Protocol tests
    needs: select
    if: needs.select.outputs.protocol == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Protocol tests
        run: pnpm test protocol

  extended:
    name: Extended tests
    needs: select
    if: needs.select.outputs.extended == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Extended tests
        run: pnpm test extended

  tooling:
    name: Tooling tests
    needs: select
    if: needs.select.outputs.tooling == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Tooling tests
        run: pnpm test tooling

  docs:
    name: Public API and examples
    needs: select
    if: needs.select.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run check
      - name: Public API reference and reference example
        run: |
          pnpm run api-docs --check
          pnpm run api-check
          pnpm run reference-check
      - name: Examples
        if: needs.select.outputs.examples == 'true'
        run: pnpm run examples-check
      - name: Documentation code blocks against packed declarations
        if: needs.select.outputs.consumer == 'true'
        run: pnpm run consumer-check

  website:
    name: Website build
    needs: select
    if: needs.select.outputs.website == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Website build
        run: pnpm --filter @skeld/website run build

  checks:
    name: Checks
    needs: [ select, static, codeql, quick, database, protocol, extended, tooling, docs, website ]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Require every selected job to pass
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
