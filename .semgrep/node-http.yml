rules:
  - id: node-http-request-to-code-execution
    languages: [ typescript, javascript ]
    severity: ERROR
    message: >-
      Data from a node:http request reaches eval, Function or node:vm, which run it as code.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: $HTTP.createServer(($REQ, ...) => { ... }, ...)
              - pattern-inside: $HTTP.createServer(function ($REQ, ...) { ... }, ...)
              - pattern-inside: $HTTP.createServer($OPTIONS, ($REQ, ...) => { ... })
              - pattern-inside: $HTTP.createServer($OPTIONS, function ($REQ, ...) { ... })
              - pattern-inside: createServer(($REQ, ...) => { ... }, ...)
              - pattern-inside: createServer(function ($REQ, ...) { ... }, ...)
              - pattern-inside: createServer($OPTIONS, ($REQ, ...) => { ... })
              - pattern-inside: createServer($OPTIONS, function ($REQ, ...) { ... })
              - pattern-inside: $SERVER.on('request', ($REQ, ...) => { ... })
              - pattern-inside: $SERVER.on('request', function ($REQ, ...) { ... })
              - pattern-inside: "function $F(..., $REQ: IncomingMessage, ...) { ... }"
              - pattern-inside: "(..., $REQ: IncomingMessage, ...) => { ... }"
          - pattern-either:
              - pattern: $REQ.url
              - pattern: $REQ.headers
              - pattern: $REQ.rawHeaders
              - pattern: $REQ.headersDistinct
              - patterns:
                  - pattern-either:
                      - pattern-inside: $REQ.on('data', ($CHUNK) => { ... })
                      - pattern-inside: $REQ.on('data', function ($CHUNK) { ... })
                      - pattern-inside: |
                          for await (const $CHUNK of $REQ) { ... }
                  - pattern: $CHUNK
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($SINK)
              - pattern: new Function(..., $SINK)
              - pattern: Function(..., $SINK)
          - focus-metavariable: $SINK
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { ..., runInContext, ... } from '$MOD';
                  ...
              - pattern-inside: |
                  import { ..., runInNewContext, ... } from '$MOD';
                  ...
              - pattern-inside: |
                  import { ..., runInThisContext, ... } from '$MOD';
                  ...
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(node:)?vm$
          - pattern-either:
              - pattern: "runInContext($SINK, ...)"
              - pattern: "runInNewContext($SINK, ...)"
              - pattern: "runInThisContext($SINK, ...)"
          - focus-metavariable: $SINK
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $NS from '$MOD';
                  ...
              - pattern-inside: |
                  import * as $NS from '$MOD';
                  ...
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(node:)?vm$
          - pattern-either:
              - pattern: "$NS.runInContext($SINK, ...)"
              - pattern: "$NS.runInNewContext($SINK, ...)"
              - pattern: "$NS.runInThisContext($SINK, ...)"
          - focus-metavariable: $SINK
    metadata:
      category: security
      cwe: "CWE-94: Improper Control of Generation of Code"
      references:
        - ".project/references/node/doc/api/http.md:3675 http.createServer([options][, requestListener])"
        - ".project/references/node/doc/api/http.md:1683 Event 'request'"
        - ".project/references/node/doc/api/http.md:3146 message.url"
        - ".project/references/node/doc/api/http.md:2875 message.headers"
        - ".project/references/node/doc/api/http.md:2975 message.rawHeaders"
        - ".project/references/node/doc/api/http.md:2926 message.headersDistinct"
        - ".project/references/node/doc/api/stream.md:1234 Event 'data'"
        - ".project/references/node/doc/api/stream.md:1973 readable[Symbol.asyncIterator]()"
        - ".project/references/node/doc/api/vm.md:1652 vm.runInContext(code, contextifiedObject[, options])"
        - ".project/references/node/doc/api/vm.md:1742 vm.runInNewContext(code[, contextObject[, options]])"
        - ".project/references/node/doc/api/vm.md:1888 vm.runInThisContext(code[, options])"
  - id: node-http-request-to-shell
    languages: [ typescript, javascript ]
    severity: ERROR
    message: >-
      Data from a node:http request reaches a node:child_process call that runs a shell.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: $HTTP.createServer(($REQ, ...) => { ... }, ...)
              - pattern-inside: $HTTP.createServer(function ($REQ, ...) { ... }, ...)
              - pattern-inside: $HTTP.createServer($OPTIONS, ($REQ, ...) => { ... })
              - pattern-inside: $HTTP.createServer($OPTIONS, function ($REQ, ...) { ... })
              - pattern-inside: createServer(($REQ, ...) => { ... }, ...)
              - pattern-inside: createServer(function ($REQ, ...) { ... }, ...)
              - pattern-inside: createServer($OPTIONS, ($REQ, ...) => { ... })
              - pattern-inside: createServer($OPTIONS, function ($REQ, ...) { ... })
              - pattern-inside: $SERVER.on('request', ($REQ, ...) => { ... })
              - pattern-inside: $SERVER.on('request', function ($REQ, ...) { ... })
              - pattern-inside: "function $F(..., $REQ: IncomingMessage, ...) { ... }"
              - pattern-inside: "(..., $REQ: IncomingMessage, ...) => { ... }"
          - pattern-either:
              - pattern: $REQ.url
              - pattern: $REQ.headers
              - pattern: $REQ.rawHeaders
              - pattern: $REQ.headersDistinct
              - patterns:
                  - pattern-either:
                      - pattern-inside: $REQ.on('data', ($CHUNK) => { ... })
                      - pattern-inside: $REQ.on('data', function ($CHUNK) { ... })
                      - pattern-inside: |
                          for await (const $CHUNK of $REQ) { ... }
                  - pattern: $CHUNK
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { ..., exec, ... } from '$MOD';
                  ...
              - pattern-inside: |
                  import { ..., execSync, ... } from '$MOD';
                  ...
              - pattern-inside: |
                  import { ..., spawn, ... } from '$MOD';
                  ...
              - pattern-inside: |
                  import { ..., spawnSync, ... } from '$MOD';
                  ...
              - pattern-inside: |
                  import { ..., execFile, ... } from '$MOD';
                  ...
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(node:)?child_process$
          - pattern-either:
              - pattern: "exec($SINK, ...)"
              - pattern: "execSync($SINK, ...)"
              - pattern: "spawn($SINK, ..., {..., shell: true, ...})"
              - pattern: "spawnSync($SINK, ..., {..., shell: true, ...})"
              - pattern: "execFile($SINK, ..., {..., shell: true, ...}, ...)"
              - pattern: "spawn($CMD, [..., $SINK, ...], {..., shell: true, ...})"
              - pattern: "spawnSync($CMD, [..., $SINK, ...], {..., shell: true, ...})"
              - pattern: "execFile($CMD, [..., $SINK, ...], {..., shell: true, ...}, ...)"
          - focus-metavariable: $SINK
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $NS from '$MOD';
                  ...
              - pattern-inside: |
                  import * as $NS from '$MOD';
                  ...
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(node:)?child_process$
          - pattern-either:
              - pattern: "$NS.exec($SINK, ...)"
              - pattern: "$NS.execSync($SINK, ...)"
              - pattern: "$NS.spawn($SINK, ..., {..., shell: true, ...})"
              - pattern: "$NS.spawnSync($SINK, ..., {..., shell: true, ...})"
              - pattern: "$NS.execFile($SINK, ..., {..., shell: true, ...}, ...)"
              - pattern: "$NS.spawn($CMD, [..., $SINK, ...], {..., shell: true, ...})"
              - pattern: "$NS.spawnSync($CMD, [..., $SINK, ...], {..., shell: true, ...})"
              - pattern: "$NS.execFile($CMD, [..., $SINK, ...], {..., shell: true, ...}, ...)"
          - focus-metavariable: $SINK
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      references:
        - ".project/references/node/doc/api/http.md:3675 http.createServer([options][, requestListener])"
        - ".project/references/node/doc/api/http.md:1683 Event 'request'"
        - ".project/references/node/doc/api/http.md:3146 message.url"
        - ".project/references/node/doc/api/http.md:2875 message.headers"
        - ".project/references/node/doc/api/http.md:2975 message.rawHeaders"
        - ".project/references/node/doc/api/http.md:2926 message.headersDistinct"
        - ".project/references/node/doc/api/stream.md:1234 Event 'data'"
        - ".project/references/node/doc/api/stream.md:1973 readable[Symbol.asyncIterator]()"
        - ".project/references/node/doc/api/child_process.md:154 child_process.exec(command[, options][, callback])"
        - ".project/references/node/doc/api/child_process.md:1286 child_process.execSync(command[, options])"
        - ".project/references/node/doc/api/child_process.md:646 child_process.spawn(command[, args][, options])"
        - ".project/references/node/doc/api/child_process.md:1355 child_process.spawnSync(command[, args][, options])"
        - ".project/references/node/doc/api/child_process.md:337 child_process.execFile(file[, args][, options][, callback])"
  - id: node-http-request-to-fs-path
    languages: [ typescript, javascript ]
    severity: ERROR
    message: >-
      Data from a node:http request reaches the path argument of a node:fs call.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: $HTTP.createServer(($REQ, ...) => { ... }, ...)
              - pattern-inside: $HTTP.createServer(function ($REQ, ...) { ... }, ...)
              - pattern-inside: $HTTP.createServer($OPTIONS, ($REQ, ...) => { ... })
              - pattern-inside: $HTTP.createServer($OPTIONS, function ($REQ, ...) { ... })
              - pattern-inside: createServer(($REQ, ...) => { ... }, ...)
              - pattern-inside: createServer(function ($REQ, ...) { ... }, ...)
              - pattern-inside: createServer($OPTIONS, ($REQ, ...) => { ... })
              - pattern-inside: createServer($OPTIONS, function ($REQ, ...) { ... })
              - pattern-inside: $SERVER.on('request', ($REQ, ...) => { ... })
              - pattern-inside: $SERVER.on('request', function ($REQ, ...) { ... })
              - pattern-inside: "function $F(..., $REQ: IncomingMessage, ...) { ... }"
              - pattern-inside: "(..., $REQ: IncomingMessage, ...) => { ... }"
          - pattern-either:
              - pattern: $REQ.url
              - pattern: $REQ.headers
              - pattern: $REQ.rawHeaders
              - pattern: $REQ.headersDistinct
              - patterns:
                  - pattern-either:
                      - pattern-inside: $REQ.on('data', ($CHUNK) => { ... })
                      - pattern-inside: $REQ.on('data', function ($CHUNK) { ... })
                      - pattern-inside: |
                          for await (const $CHUNK of $REQ) { ... }
                  - pattern: $CHUNK
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              import { ..., $FN, ... } from '$MOD';
              ...
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(node:)?fs(/promises)?$
          - pattern: $FN($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $NS from '$MOD';
                  ...
              - pattern-inside: |
                  import * as $NS from '$MOD';
                  ...
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(node:)?fs(/promises)?$
          - pattern-either:
              - pattern: "$NS.$FN($SINK, ...)"
              - pattern: "$NS.promises.$FN($SINK, ...)"
          - focus-metavariable: $SINK
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      references:
        - ".project/references/node/doc/api/http.md:3675 http.createServer([options][, requestListener])"
        - ".project/references/node/doc/api/http.md:1683 Event 'request'"
        - ".project/references/node/doc/api/http.md:3146 message.url"
        - ".project/references/node/doc/api/http.md:2875 message.headers"
        - ".project/references/node/doc/api/http.md:2975 message.rawHeaders"
        - ".project/references/node/doc/api/http.md:2926 message.headersDistinct"
        - ".project/references/node/doc/api/stream.md:1234 Event 'data'"
        - ".project/references/node/doc/api/stream.md:1973 readable[Symbol.asyncIterator]()"
        - ".project/references/node/doc/api/fs.md:124 Promises API"
        - ".project/references/node/doc/api/fs.md:2380 Callback API"
        - ".project/references/node/doc/api/fs.md:5873 Synchronous API"
        - ".project/references/node/doc/api/fs.md:1841 fsPromises.readFile(path[, options])"
        - ".project/references/node/doc/api/fs.md:4388 fs.readFile(path[, options], callback)"
