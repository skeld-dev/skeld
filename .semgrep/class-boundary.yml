rules:
  - id: class-outside-error-types-and-lifecycle-records
    languages: [ typescript ]
    severity: ERROR
    message: >-
      A class is allowed only for an error type that extends Error, or for a per-request record in
      packages/core/src/lifecycle/ (ADR-013); services, servers, scopes, plugins, dispatchers,
      routers and modules are factories returning plain objects.
    paths:
      exclude:
        - "/packages/core/src/lifecycle/"
        - "/packages/core/src/schema/secret.ts"
        - "**/dist/**"
        - "**/.tsout/**"
    patterns:
      - pattern-either:
          - pattern: class $C { ... }
          - pattern: class { ... }
      - pattern-not: class $C extends Error { ... }
      - pattern-not: class $C extends HttpError { ... }
  - id: lifecycle-record-class-method
    languages: [ typescript ]
    severity: ERROR
    message: >-
      A lifecycle record class carries readonly fields, a constructor and getters only (ADR-013);
      a method or setter is outside the exception.
    paths:
      include:
        - "/packages/core/src/lifecycle/"
    patterns:
      - pattern-either:
          - pattern: class $C { ... $M(...) { ... } ... }
          - pattern: class { ... $M(...) { ... } ... }
      - focus-metavariable: $M
      - pattern-regex: (?m)(?:^|[{;])[ \t]*(?:static[ \t]+|async[ \t]+|set[ \t]+|\*[ \t]*)*(?!(?:get|constructor)\b)#?\w+[ \t]*[(<]
  - id: secret-class-member
    languages: [ typescript ]
    severity: ERROR
    message: >-
      The Secret class carries only #value, a constructor, a static block, toString, toJSON and the
      inspect method (ADR-021); any other member can read or widen the wrapped value.
    paths:
      include:
        - "/packages/core/src/schema/secret.ts"
    patterns:
      - pattern-regex: (?ms)^(?:export[ \t]+)?class[ \t][^\n]*\{[ \t]*$.*?^\}
      - pattern-regex: (?m)^[ ]{2}(?![ }])(?!/[/*])(?!(?:readonly[ \t]+)?#value\b[^(\n]*;[ \t]*$)(?!constructor\()(?!static[ \t]*\{)(?!toString\(\))(?!toJSON\(\))(?!\[Symbol\.for\('nodejs\.util\.inspect\.custom'\)\]\(\))[^\n]*
